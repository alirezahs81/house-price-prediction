name: controlled-model-experiments

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/experiments.py'
      - 'data/raw/train.csv'
      - 'requirements.txt'
      - '.github/workflows/experiments.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiments:
    name: Compare controlled model variants
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run controlled experiments
        run: python -m src.experiments
        env:
          PYTHONPATH: ${{ github.workspace }}
      - name: Upload experiment results
        uses: actions/upload-artifact@v7
        with:
          name: controlled-model-experiments
          path: reports/experiments/
          retention-days: 7
