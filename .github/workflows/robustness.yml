name: model-robustness

on:
  pull_request:
    branches: [main]
    paths:
      - "src/robustness.py"
      - "tests/test_robustness.py"
      - "data/raw/train.csv"
      - "requirements.txt"
      - ".github/workflows/robustness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  robustness:
    name: Evaluate model stability across 30 seeds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run robustness experiment
        run: python -m src.robustness --seeds 30 --start-seed 42
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Upload robustness reports
        uses: actions/upload-artifact@v7
        with:
          name: model-robustness-30-seeds
          path: reports/robustness/
          if-no-files-found: error
          retention-days: 14
