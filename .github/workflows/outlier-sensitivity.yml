name: outlier-sensitivity

on:
  pull_request:
    branches: [experiment/robustness-30-seeds]
    paths:
      - "src/outlier_sensitivity.py"
      - "tests/test_outlier_sensitivity.py"
      - "src/**"
      - "data/raw/train.csv"
      - "requirements.txt"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/outlier-sensitivity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pre-commit checks
        run: pre-commit run --all-files

      - name: Run unit tests
        run: python -m pytest -v

  sensitivity:
    name: Compare baseline and train-only exclusion across 30 seeds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run paired train-only sensitivity experiment
        run: python -m src.outlier_sensitivity --seeds 30 --start-seed 42 --flagged-ids 524 1299
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Upload sensitivity reports
        uses: actions/upload-artifact@v7
        with:
          name: outlier-sensitivity-30-seeds
          path: reports/outlier_sensitivity/
          if-no-files-found: error
          retention-days: 14
