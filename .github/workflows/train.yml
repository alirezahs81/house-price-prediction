name: train-and-validate

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/raw/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/train.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/raw/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/train.yml'
  workflow_dispatch:

jobs:
  train:
    name: Train and Validate Model
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run exploratory analysis
        run: python -m main eda

      - name: Train model
        run: python -m main train
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Validate predictions
        run: python -m main predict
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Check prediction output
        run: |
          echo "Checking prediction file..."
          head -5 reports/predictions.csv
          echo "Row count: $(wc -l < reports/predictions.csv)"

      - name: Upload model artifact
        uses: actions/upload-artifact@v7
        with:
          name: trained-model
          path: models/best_model.joblib
          retention-days: 7

      - name: Upload reports
        uses: actions/upload-artifact@v7
        with:
          name: training-reports
          path: reports/
          retention-days: 7

      - name: Add training results to job summary
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metrics_path = Path("reports/metrics/validation_metrics.json")
          if not metrics_path.is_file():
              raise SystemExit(f"Missing training metrics: {metrics_path}")

          metrics = json.loads(metrics_path.read_text(encoding="utf-8"))
          best_params = json.dumps(
              metrics.get("best_params", {}),
              indent=2,
              ensure_ascii=False,
          )
          summary = f"""## Model Training Results

          **Selected Model:** {metrics["selected_model"]}

          **Validation Metrics:**
          - MAE: ${metrics["MAE"]:,.2f}
          - RMSE: ${metrics["RMSE"]:,.2f}
          - R²: {metrics["R2"]:.4f}
          - RMSLE: {metrics["RMSLE"]:.4f}

          **Best Parameters:**
          ```json
          {best_params}
          ```

          Workflow run: {os.environ["GITHUB_RUN_NUMBER"]}
          """
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write(summary + "\n")
          PY
