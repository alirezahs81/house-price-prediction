name: histgb-price-weighting-experiment

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/histgb-price-weighting-experiment.yml'
      - 'src/**'
      - 'data/raw/train.csv'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-experiment:
    name: Paired HistGradientBoosting weighting experiment
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run paired experiment
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m scripts.compare_histgb_sample_weight
      - name: Add experiment summary
        if: always()
        run: |
          if [ -f reports/experiments/histgb_weighting_summary.md ]; then
            cat reports/experiments/histgb_weighting_summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Experiment did not produce a summary report." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload experiment reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: histgb-price-weighting-experiment
          path: reports/experiments/
          if-no-files-found: warn
          retention-days: 14
