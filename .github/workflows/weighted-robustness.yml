name: paired-weighted-robustness

on:
  pull_request:
    branches: [experiment/robustness-30-seeds, main]
    paths:
      - "src/weighted_robustness.py"
      - "src/robustness.py"
      - "src/**"
      - "tests/test_weighted_robustness.py"
      - "data/raw/train.csv"
      - "requirements.txt"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/weighted-robustness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run pre-commit checks
        run: pre-commit run --all-files
      - name: Run unit tests
        run: python -m pytest -v

  paired-comparison:
    name: Compare baseline and price-weighted models on 30 paired splits
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run paired 30-seed comparison
        run: python -m src.weighted_robustness --seeds 30 --start-seed 42
        env:
          PYTHONPATH: ${{ github.workspace }}
      - name: Upload paired comparison reports
        uses: actions/upload-artifact@v7
        with:
          name: paired-weighted-robustness-30-seeds
          path: reports/weighted_robustness/
          if-no-files-found: error
          retention-days: 14
