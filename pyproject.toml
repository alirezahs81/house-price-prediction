[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "house-price-prediction"
version = "1.0.0"
description = "Reproducible Ames Housing regression project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.7",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "black==24.10.0",
    "isort==5.13.2",
    "flake8==7.1.1",
    "flake8-bugbear==24.9.2",
    "pre-commit==3.8.0",
    "mypy==1.13.0",
    "pandas-stubs==2.2.0",
    "numpy-stubs==1.5.0",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "mkdocs==1.6.1",
    "mkdocs-material==9.5.27",
    "mkdocstrings[python]==0.26.1",
    "jupyterlab==4.2.5",
    "ipykernel==6.29.5",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.5.27",
    "mkdocstrings[python]==0.26.1",
]
notebook = [
    "jupyterlab==4.2.5",
    "ipykernel==6.29.5",
]

[project.urls]
Homepage = "https://github.com/yourusername/house-price-prediction"
Repository = "https://github.com/yourusername/house-price-prediction"
Issues = "https://github.com/yourusername/house-price-prediction/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --cov=src --cov-report=term-missing"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.git
  | \.venv
  | venv
  | __pycache__
  | \.pytest_cache
  | \.mypy_cache
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true

[tool.flake8]
max-line-length = 88
extend-ignore = "E203,W503"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "C",   # mccabe complexity
    "B",   # bugbear
    "B9",  # bugbear
]
per-file-ignores = { "tests/*" = "S101" }  # Allow assert in tests

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]